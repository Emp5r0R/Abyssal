[package]
name = "mirage-server"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[features]
integration-release-root = ["abyssal-core/integration-release-root"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "=0.3.34"
hmac = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.7"
abyssal-core = { path = "../rust-core" }
base64 = "=0.23.1"

[dev-dependencies]
ed25519-dalek = "2.2"
