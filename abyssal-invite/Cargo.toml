[package]
name = "abyssal-invite"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
base64 = "=0.23.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core", "std", "zeroize"] }
# The invite format shared with Ket: https://github.com/Emp5r0R/Ket/tree/main/crates/invite-capsule
invite-capsule = { git = "https://github.com/Emp5r0R/Ket", rev = "1a440eec65de2bfaa3fe74db86d5ab83153bbe62" }
rand = "0.10"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
