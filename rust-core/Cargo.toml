[package]
name = "abyssal-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[dependencies]
# Secure memory wiping on drop
zeroize = { version = "1.7", features = ["derive"] }

# Cryptography
chacha20poly1305 = "0.10"
rand = "0.8"
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
sha2 = "0.11"
# opaque-ke 4.0.1 still exposes its OPAQUE hash boundary through digest 0.10.
# Keep that protocol hash on its compatible implementation while the direct
# protocol SHA-256/HKDF consumers use sha2 0.11 above.
sha2-legacy = { package = "sha2", version = "0.10" }
base64 = "=0.23.1"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
vodozemac = { version = "0.10.0", features = ["experimental-session-config"] }

# UniFFI for Kotlin bindings generation
uniffi = { version = "0.32", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[build-dependencies]
uniffi = { version = "0.32", default-features = false, features = ["build"] }
