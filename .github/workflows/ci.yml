name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - run: bash ./scripts/test-all.sh quick
      - run: bash ./scripts/test-all.sh integration

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: bash ./scripts/test-all.sh shell
      - run: ABYSSAL_GRADLE_HOME="$HOME/.gradle" bash ./scripts/test-all.sh android

  crypto-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "ndk;27.3.13750724"
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724" bash ./scripts/test-all.sh crypto
      - run: git diff --exit-code -- rust-core/generated-bindings.sha256 rust-core/generated-artifacts.sha256 apps/web/src/generated/abyssal_core android/app/src/main/java/uniffi/abyssal_core android/app/src/main/jniLibs

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - run: npm ci --ignore-scripts
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: bash ./scripts/test-all.sh audit
