services:
  mirage-server:
    build:
      context: ../mirage-server
    image: mirage-server:latest
    restart: unless-stopped
    env_file:
      - path: ../mirage-server/.env
        required: false
    environment:
      ABYSSAL_BIND_ADDR: 0.0.0.0:4020
    ports:
      - "4020:4020"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
