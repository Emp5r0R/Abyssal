services:
  mirage-server:
    build:
      context: ..
      dockerfile: mirage-server/Dockerfile
    image: mirage-server:latest
    user: "${ABYSSAL_CONTAINER_UID:-10001}:${ABYSSAL_CONTAINER_GID:-10001}"
    # A crash must stay visible to the operator. Automatic restart would
    # generate a fresh capability set while the none log driver discards it.
    restart: "no"
    init: true
    stop_grace_period: 10s
    pids_limit: 128
    ulimits:
      core: 0
    # Keep headroom for the 512 MiB global attachment pool. The pool already
    # accounts for stored blobs and in-flight upload/download references.
    # Override with ABYSSAL_CONTAINER_MEMORY_LIMIT when sizing a host.
    mem_limit: ${ABYSSAL_CONTAINER_MEMORY_LIMIT:-2g}
    env_file:
      - path: ../mirage-server/.env
        required: false
    environment:
      ABYSSAL_BIND_ADDR: 0.0.0.0:4020
    volumes:
      - ../.secrets/node-signing.key:/run/secrets/abyssal-node-signing-key:ro
    ports:
      - "127.0.0.1:4020:4020"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none
