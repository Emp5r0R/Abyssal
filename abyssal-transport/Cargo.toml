[package]
name = "abyssal-transport"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
hkdf = "0.13"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1.7", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
